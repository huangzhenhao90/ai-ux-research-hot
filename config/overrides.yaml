# 人工覆盖：替代 AIHOT 的后台操作。改动只影响发布结果，不改动 data/items 里的原始判断。
#
# 用法（阶段 5 的 pipeline/select.py 读取）：
#   select: 强制入选（即使分数没过门槛）
#   reject: 强制剔除（即使分数过了门槛）
#   category: 改分类
#
# 匹配键 `url` 用规范化后的 URL（去 utm 等追踪参数、去尾斜杠）；
# 也可以用 `urlPrefix` 做前缀匹配（例如某一批同类文章）。
#
# ⚠️ 本文件初始为空。发现误选/漏选时在这里手工纠正，不要改 prompts 去迁就个例。

select: []
reject: []
category: []

# 示例（注释形式，避免误生效）：
#
# select:
#   - url: https://example.com/some-important-report
#     note: 行业规范首发，分数被低估
# reject:
#   - url: https://example.com/vendor-webinar-promo
#     note: 研讨会报名软文
# category:
#   - url: https://example.com/paper-with-code
#     category: research
#     note: 有实验对照，重心在证据而非工具
