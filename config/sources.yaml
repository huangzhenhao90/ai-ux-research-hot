# 信源名单（D5 确认版，共 44 个）。
#
# 字段：
#   id / name          信源标识与显示名
#   kind               rss | web_list | external_json
#   url                feed 地址 或 列表页地址
#   tier               T1 官方一手 | T1_5 官方账号与准官方 | T2 媒体与个人 | EXCLUDE 不参与精选
#   mode               editorial 参与精选 | hot_signal 只记热度不展示 | isolated 隔离
#   entity             对应 taxonomy.yaml 的 entities id（可选）
#   initialBackfillLimit  首次导入只取前 N 条并全部归档（防旧文刷屏）
#   timezone           无时区日期按此解析（默认 +08:00）
#   web_list           仅 kind=web_list 需要：itemSelector/titleSelector/linkSelector/dateSelector
#
# 全部地址均由执行模型实测：HTTP 200 + 有条目 + 日期可解析（无日期的源已在 note 注明）。
# 探测方法见 scripts/probe_feeds.py；web_list 选择器实测结果见 eval/weblist-selectors.json。

