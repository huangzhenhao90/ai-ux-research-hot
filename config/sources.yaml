  # ══ T1 官方一手：无 RSS，用网页列表抓取（选择器实测见 eval/weblist-selectors.json）══
  - id: usertesting-blog
    name: UserTesting Blog
    kind: web_list
    url: https://www.usertesting.com/blog
    tier: T1
    mode: editorial
    entity: usertesting
    web_list:
      itemSelector: 'div.teaser, div.featured-card'
      titleSelector: 'h4'
      linkSelector: 'a[href^="/blog/"]'
      dateSelector: null
    note: ⚠️ 列表页无日期（整页无 time 元素）→ dateSelector 为 null；分页是 JS 无限滚动，静态只拿首屏约 12 条

  - id: userinterviews-blog
    name: User Interviews Blog
    kind: web_list
    url: https://www.userinterviews.com/blog
    tier: T1
    mode: editorial
    entity: user-interviews
    web_list:
      itemSelector: 'div.blog-item.w-dyn-item'
      titleSelector: 'div[fs-cmsfilter-field="header"]'
      linkSelector: 'a.content-feed-link-block.blog'
      dateSelector: 'div.blog-grid-txt-wrap > div:last-child div.content-grid-eyebrow'
    note: 日期必须限定在最后一个子 div 内，否则会先取到分类名；侧栏另有 24 条重复列表，已用 itemSelector 避开

  - id: optimalworkshop-blog
    name: Optimal Workshop Blog
    kind: web_list
    url: https://www.optimalworkshop.com/blog
    tier: T1
    mode: editorial
    entity: optimal-workshop
    web_list:
      itemSelector: 'a.blog-item'
      titleSelector: 'h2, h3'
      linkSelector: ':scope'
      dateSelector: null
    note: ⚠️ 卡片只有阅读时长无日期 → dateSelector 为 null；1 条 featured(h2) + 6 条网格(h3)

  - id: greatquestion-blog
    name: Great Question Blog
    kind: web_list
    # 原 https://greatquestion.co/blog 会 301 到 www.greatquestion.com，统一用 www
    url: https://www.greatquestion.com/blog
    tier: T1
    mode: editorial
    entity: great-question
    web_list:
      itemSelector: 'div.mt-10 > a[href^="/blog/"], div.grid.gap-x-12.gap-y-14 > a'
      titleSelector: 'h2'
      linkSelector: ':scope'
      dateSelector: 'div.font-mono span'
    note: 已刻意排除 /blog/page/N 分页链接；featured 大卡的 span 文本是 Featured 而非日期，该条 date 为 null（预期）

  - id: sprig-blog
    name: Sprig Blog
    kind: web_list
    url: https://sprig.com/blog
    tier: T1
    mode: editorial
    entity: sprig
    web_list:
      itemSelector: 'a.blog-cms-card'
      titleSelector: 'h4'
      linkSelector: ':scope'
      dateSelector: 'div.text-size-tiny_v2'
    note: itemSelector 命中 41 节点，含 16 条桌面/移动重复 DOM，按 URL 去重后约 25 条

  - id: strella-blog
    name: Strella Blog
    kind: web_list
    # 原 https://strella.io/blog 会 301 到 www.strella.io
    url: https://www.strella.io/blog
    tier: T1
    mode: editorial
    entity: strella
    web_list:
      itemSelector: 'div.collection-case-study-post.w-dyn-item, div.collection-side-item.w-dyn-item, div.collection-grid-item.w-dyn-item'
      titleSelector: 'h2'
      linkSelector: 'a[href^="/blog/"]'
      dateSelector: 'div.data-text'
    note: item 必须用容器层：日期在 a 的兄弟节点里（日期在 item 外），用 a 当 item 会漏掉 hero 与 side 共 3 条的日期

  - id: maze-blog
    name: Maze Blog
    kind: web_list
    url: https://maze.co/blog/
    tier: T1
    mode: editorial
    entity: maze
    web_list:
      itemSelector: 'a[class*="BlogPostPreviewLink"]'
      titleSelector: 'article > div:last-child > p'
      linkSelector: ':scope'
      dateSelector: null
    note: >-
      ⚠️ 文章链接带尾斜杠（/blog/xxx/），写正则时不可要求以字母数字结尾；
      卡片无日期 → dateSelector 为 null；列表页仅 6 条 + /blog/page/N 分页；
      itemSelector 依赖 styled-components 的组件名前缀（哈希后缀随构建变化，前缀稳定）

  - id: dscout-people-nerds
    name: dscout People Nerds
    kind: web_list
    url: https://dscout.com/people-nerds
    tier: T1
    mode: editorial
    entity: dscout
    web_list:
      itemSelector: 'div.postpreview'
      titleSelector: 'h1.postpreview_title'
      linkSelector: 'a.postpreview_text'
      dateSelector: 'p.postpreview_date'
    note: 文章前缀是 /people-nerds/<slug> 而非 /blog/；日期格式混用（月全称与月缩写）

  - id: mrs-news
    name: MRS（英国市场研究协会）新闻
    kind: web_list
    url: https://www.mrs.org.uk/news
    tier: T1
    mode: editorial
    entity: mrs
    web_list:
      itemSelector: 'div.guide_.blog_ a.guide_row'
      titleSelector: 'h5'
      linkSelector: ':scope'
      dateSelector: 'div.blog_desc > p'
    note: 列表混排 5 条 /article/mrs/ 与 5 条 /blog/<分类>/；必须限定容器，否则会误抓页脚那条链接

  # ══ 外部 JSON 信源（D12：并入 ur-ai-papers 的高分论文）══════════════════
  - id: ur-ai-papers
    name: ur-ai-papers（用户与交互 AI 论文库）
    kind: external_json
    url: https://raw.githubusercontent.com/huangzhenhao90/ur-ai-papers/main/web/public/data/papers.json
    tier: T2
    mode: editorial
    initialBackfillLimit: 8
    note: >-
      ⚠️ 只读上游：不得修改、提交、推送或停用 ur-ai-papers 仓库（其 AGENTS.md 契约 1）。
      实测 1857 篇，字段含 ai_score/domain_score（1–5）、tldr、title_zh。
      只取近 30 天内且 ai_score ≥ 4 的论文，否则一次会灌进上千条。
      ⚠️ date 会到 2027-01（期刊提前标期号），这类未来日期按不可信处理、不公开。
