# 精选门槛与预算。
#
# ── 门槛的来历（改之前请读完）─────────────────────────────────────────
#
# 原值是 AIHOT 在「AI 领域」用的 60 / 65 / 76。实测在「AI 用研」这个行业里，
# 这个标准坐在分数分布的**极右尾**：170 条已评分条目只选出 5 条（2.9%），
# 按每天约 20 条新条目换算，日均入选 **0.6 条** —— 日报几乎每天都是空刊。
#
# 2026-10-22 按用户指示放宽到「中等严格」。依据是分数分布，不是感觉：
#
#   门槛 T1/T2    通过率    日均入选（按 20 条/日）
#   60 / 76        2.9%     0.6 条   ← 原值（几近空刊）
#   50 / 60       10.6%     2.1 条
#   45 / 55      17.1%     3.4 条
#   40 / 50      26.5%     5.3 条   ← 现值（中等）
#   35 / 45      37.6%     7.5 条
#
# 为什么最终落在 40 而不是 45：逐档看过分数带里的实际内容 ——
#   33–45 分：NN/g 的 AI 原型文章、「主题分析码本怎么建」、「定性分析的编码是不是太多」
#             这类**确实该收**的东西，卡在 45 会把它们挡在外面；
#   25–33 分：开始混杂「Ignite Growth with Collective Innovation」「大会博客」这类泛内容；
#   15–25 分：基本是 SEO 型泛文（「最佳企业级 AI 研究平台对比」「该不该用 NVivo」）；
#   15 分以下：明显跑题。
# 也就是**噪声地板大致在 25–30 之间**，40 能收住 33–45 这段好东西又不碰混合带。
#
# ⚠️ **这一组数字是「按分布定的」，不是「按金标验证的」。**
#    它解决了「太空」的问题，但没有回答「放宽会不会放进噪声」。
#    计划 §阶段 8 的目标是「查准率 ≥0.8」，那需要人工金标才能算。
#    在拿到金标之前，这组值属于**临时值**，别把它当成已验证的结论。
#    觉得日均还是太少就把 T1 降到 35；觉得进来的东西杂就升回 45。

# 信源分级 → 入选门槛（两次评分的平均分至少要到这个数）。
# T1 官方一手门槛低一些，T2 媒体与个人高一些：同样一件事，官方原文更值得先看。
thresholds:
  T1: 40
  T1_5: 45
  T2: 50

# 未入选、但平均分高于这个数的资料，也用精选写法（标题/摘要/推荐理由）来写，
# 其余用更便宜的 summarize-*.md 写简短标题摘要，进「全部动态」。
understandFloor: 50

# 首次发现时已发布超过此时长的资料 → 归档，不进「今天」与日报。
# 注意（阶段 2 发现）：ur-ai-papers 的论文 date 有未来日期（期刊提前标期号），
# 阶段 5 必须先处理未来日期，否则会被当成「刚发布」全涌上首页。
freshHours: 48

# 预算熔断（D9）：每次运行 ≤300 次调用、每天 ≤1000 次，超出即停。
budget:
  perRunCalls: 300
  perDayCalls: 1000

# 两次独立评分：两次之和 ≥ 2 × 门槛 才成为候选。
scoreAttempts: 2

# 机械去重参数（阶段 5 用）
dedupe:
  titleSimilarity: 92      # rapidfuzz 相似度阈值（0–100）
  windowHours: 72          # 在此窗口内的近似标题视为重复
