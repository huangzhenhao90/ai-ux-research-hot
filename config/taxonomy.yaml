# 分类、标签词表、实体表。供 prompts/structure.md（{{categoryGuide}} / {{categoryTags}} /
# {{topicTags}} / {{entityTags}} / {{entities}}）与 tests/test_config.py 校验使用。
#
# ⚠️ 分类 key 按 D4 确认：上线后不改。

# ── 分类（D4：6 类，必须有 industry 兜底）────────────────────────────────
categories:
  - key: tools
    label: 工具
    section: 工具发布/更新
    commentary: false
    guide: >-
      研究工具、平台、插件、API 的发布与重大更新：AI 访谈/主持、合成用户、AI 问卷与文本分析、
      洞察库、可用性测试、招募、转写编码。通用大模型发布不算，除非是研究工具厂商发布的研究专用能力。

  - key: methods
    label: 方法
    section: 方法与实践
    commentary: true
    guide: >-
      能照着做的研究方法、提示词、工作流、模板、质检办法、实践复盘。
      纯介绍某工具的营销文归工具或剔除。

  - key: research
    label: 论文
    section: 研究与证据
    commentary: false
    guide: >-
      **只有真正的论文、预印本、技术报告、白皮书才归这里**：要有原始研究设计
      （实验、对照、样本、可验证的结论），例如合成受访者效度、AI 访谈 vs 人工访谈、
      LLM 编码一致性、AI 对研究岗位影响的实证。
      判定标准是「这篇有没有原始研究设计」，**不是「它是不是在讲研究」**：
      - 咨询公司/工具厂商网站上的实践文章、操作指南、术语表、案例复盘 → methods 或 opinion
      - 教程、科普、评测 → methods
      - 只有观点没有新数据的评论 → opinion
      拿不准时问自己：它做了自己的实验吗？没有就不是 research。

  - key: industry
    label: 行业
    section: 行业动态
    commentary: false
    guide: >-
      已发生的研究行业事件：研究/调研公司融资并购上市裁员、产品下线、合作、岗位与组织变化、
      隐私伦理监管、行业协会（ESOMAR、MRS）规范。材料不足时归这里。

  - key: cases
    label: 案例
    section: 案例与落地
    commentary: false
    guide: >-
      团队/公司把 AI 用进研究流程的真实案例，须有任务、规模、时间、质量、成本中至少一项具体信息。

  - key: opinion
    label: 观点
    section: 观点与讨论
    commentary: true
    guide: >-
      从业者/学者对 AI 与用研关系的判断、争论、预测、访谈。

# ── 内容类型（与 selection-score.md 的权重表、content-understanding.md 一一对应）──
itemTypes:
  - tool_launch
  - method_or_template
  - research_paper
  - industry_event
  - case_study
  - opinion_analysis
  - tutorial_explainer

# itemType → 第一个分类标签的自洽对照（供 content-understanding.md 输出前自查）
