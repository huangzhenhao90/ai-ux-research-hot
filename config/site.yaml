# 站点配置。文案里的 {{siteName}} / {{subject}} 等占位符由 uxhot/prompts.py 从这里取值渲染。
#
# ⚠️ siteUrl 按 D7 的确认值：仓库名为 ai-ux-research-hot，不是 uxhot。
#    前端的 basePath / assetPrefix 也从这里取（阶段 6）。

name: UXHOT
alias: AI 用研热点
subject: AI 用研

# GitHub Pages 子路径（D6 托管方式 + D7 仓库名）
siteUrl: https://huangzhenhao90.github.io/ai-ux-research-hot

homeTitle: "UXHOT · 每天读完 AI 怎么改变用户研究"
description: "每天从研究工具官网、用研社区、HCI 学术与行业媒体收集 AI × 用户研究的动态，模型双评分筛出值得看的，每天早上出日报。"
tagline: AI 用研的每日精选

# 卡片上「推荐理由」字段的显示名
reasonLabel: 为什么值得看

# 是否在卡片上展示评分（AIHOT 默认不展示，沿用）
showScore: false

locale: zh-CN
timezone: Asia/Shanghai

# 出刊时间（D10）。日报 08:00 北京时间；周报周一 10:00。
# 注意：GitHub Actions 定时任务常延迟 5–30 分钟，关于页如实写「每天早上 8 点后」。
editions:
  daily: "08:00"
  weekly: "MON 10:00"

# 采集器 UA（关于页与 robots 礼仪用）
crawlerName: UXHOTBot (+https://huangzhenhao90.github.io/ai-ux-research-hot/about)

# 关于页的致谢行（计划成功标准 6 允许的唯一一处 AIHOT 提及）
credit: 提示词与精选方法改编自 AIHOT（MIT）
