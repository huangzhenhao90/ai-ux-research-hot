name: Update

# 采集 → 预筛 → 评分 → 写作 → 去重 → 发布 → 出刊 → 构建 → 部署 Pages
#
# 定时：每 4 小时采集评分一次；UTC 00:05（北京 08:05）那一趟顺带出日报。
# 注意 GitHub 的定时任务常延迟 5–30 分钟，所以「8 点出刊」实际可能是 8:10–8:40，
# 关于页如实写的是「每天早上 8 点后」。
#
# ── 两个需要配置的开关 ────────────────────────────────────────────────
#
# 1) Secret `LLM_API_KEY`：**没配就自动降级为 dry-run**（只抓取、不花钱），
#    并在日志里明确告警。这样仓库在密钥就位前也能正常跑，不会一路红。
# 2) Variable `PAGES_ENABLED`：设为 `true` 才会上传产物并部署 Pages。
#    private 仓库开不了 Pages（除非 GitHub Pro），所以默认不开；
#    阶段 8 之后把仓库转 public、在 Settings → Pages 选 GitHub Actions，
#    再把该 Variable 设成 true 即可。

on:
  schedule:
    - cron: "0 */4 * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 只抓取不调模型；execute 会真实调用模型（花钱）"
        type: choice
        options:
          - dry-run
          - execute
        default: dry-run
      limit:
        description: "每个信源最多取几条（留空表示不限制）"
        required: false
        default: ""

# 同一时刻只跑一趟；不取消进行中的（跑到一半被打断会留下不一致的状态）
concurrency:
  group: uxhot-update
  cancel-in-progress: false

permissions:
  contents: write # 把 data/ 与 web/public/ 提交回仓库
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 确定运行模式
        id: mode
        # 定时触发默认 execute；手动触发按输入
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wanted=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "wanted=execute" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查模型密钥
        id: key
        env:
          KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning title=未配置 LLM_API_KEY::本次降级为 dry-run（只抓取，不调用模型）。在 Settings → Secrets and variables → Actions 添加 LLM_API_KEY 后即可真实运行。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 跑流水线
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
        run: |
          # 只有「想要 execute」且「密钥就位」才真调模型；脚本内还有一道安全阀
          if [ "${{ steps.mode.outputs.wanted }}" = "execute" ] && [ "${{ steps.key.outputs.ready }}" = "true" ]; then
            MODE=execute
            export MODEL_CALLS_ENABLED=true
          else
            MODE=dry-run
            export MODEL_CALLS_ENABLED=false
          fi

          ARGS="--$MODE"
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "运行：python scripts/run_pipeline.py $ARGS（MODEL_CALLS_ENABLED=$MODEL_CALLS_ENABLED）"
          python scripts/run_pipeline.py $ARGS

      - name: 出日报与周报
        # 两个脚本都会跳过已存在的期，所以每趟都跑一遍即可顺带补出漏掉的
        run: |
          python scripts/build_daily.py
          python scripts/build_weekly.py

      - name: 测试
        run: python -m pytest -q

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 类型检查
        working-directory: web
        run: npm run typecheck

      - name: 构建静态站
        working-directory: web
        run: npm run build

      - name: 提交数据与产物
        # 发布校验失败时流水线不会改动 web/public，所以这里提交的是上一版，等于「保留上一版」
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新数据与站点产物"
            git push
          fi

      - name: 上传 Pages 产物
        # private 仓库开不了 Pages，用 Variable 控制；转 public 后设为 true
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: update
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
